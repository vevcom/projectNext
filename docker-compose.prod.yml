services:
    projectnext:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: prod
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        deploy:
            replicas: 2
        restart: always

    imageworker:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            # tools, not prod: the worker runs src/lib/images/worker.ts through tsx,
            # and prod carries neither src/ nor the dev dependencies - only the traced
            # Next server. tools is the stage that has the full tree.
            target: tools
        command: ["./node_modules/.bin/tsx", "src/lib/images/worker.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        # The inherited healthcheck probes :3000, which this service never listens on.
        healthcheck:
            disable: true
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        deploy:
            replicas: 1
        restart: always
        depends_on:
            db:
                condition: service_healthy

    db:
        extends:
            file: docker-compose.base.yml
            service: db
        restart: always
        volumes:
            - proddb:/var/lib/postgresql/data

    nginx:
        extends:
            file: docker-compose.base.yml
            service: nginx
        restart: always
        expose:
            - "80"
        volumes:
            - ./containers/nginx/nginx.internal.conf:/etc/nginx/nginx.conf:ro
            - store:/usr/store:ro

    postfix:
        build: ${PROJECT_ROOT:-.}/containers/postfix/
        # Reachable on the compose network only. TLS is disabled in
        # containers/postfix/main.cf.tmpl (no cert is provisioned for the mail
        # domain now that the certbot flow is gone), so publishing these to the
        # host would expose plaintext SMTP - a regression on the old cert-backed
        # setup. Postfix is not part of the Dokploy deployment either way; if it
        # is ever exposed again it needs its own certificate first.
        expose:
            - '587'
            - '25'
        environment:
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            MY_HOSTNAME: ${MAIL_DOMAIN}
            MY_DOMAIN: ${DOMAIN}
            RELAY_HOST: ${MAIL_RELAY_HOST}
        depends_on:
            - db
        links:
            - db
        restart: always

volumes:
    proddb:
        driver: local
    store:
        driver: local
    logs:
        driver: local
    dobbelOmegaManifest:
        driver: local
