events { worker_connections 1024; }

# Plain HTTP reverse proxy with no TLS/host-port concerns of its own - this
# container sits behind a platform-managed proxy (Dokploy/Coolify's Traefik)
# which terminates TLS and forwards decrypted traffic here. Mirrors
# nginx.dev.conf, which serves the same role in local development.
http {
    server {
        listen 80;

        location /store/ {
           alias /usr/store/;
           types {
                application/pdf pdf;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://projectnext:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 1000M;
            proxy_set_header Referrer-Policy no-referrer;
            proxy_buffer_size 32k;
            proxy_buffers 4 64k;
            proxy_busy_buffers_size 64k;
        }
    }
}
