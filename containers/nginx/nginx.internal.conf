events { worker_connections 1024; }

# Plain HTTP reverse proxy with no TLS/host-port concerns of its own - this
# container sits behind a platform-managed proxy (Dokploy/Coolify's Traefik)
# which terminates TLS and forwards decrypted traffic here. Mirrors
# nginx.dev.conf, which serves the same role in local development.
http {
    # Trust the platform proxy's scheme when it sends one. $scheme is always
    # "http" on the decrypted hop, so passing it through would tell the app a
    # TLS request was plaintext and make it build http:// URLs.
    map $http_x_forwarded_proto $forwarded_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen 80;

        location /store/ {
           alias /usr/store/;
           # Kept in step with nginx.dev.conf and the old default.conf. A types
           # block replaces the inherited MIME map rather than extending it, so
           # every type served from here has to be listed or it degrades to
           # default_type below.
           types {
                application/pdf pdf;
                image/svg+xml   svg;
                image/png       png;
                image/jpeg      jpeg;
                image/webp      webp;
                image/avif      avif;
                image/heic      heic;
            }
            default_type application/octet-stream;
            # These are user uploads served from the app's own origin. Without the
            # sandbox an uploaded SVG runs script as the site itself, so this is
            # what keeps an image upload from becoming stored XSS.
            add_header Content-Security-Policy "sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://projectnext:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 1000M;
            proxy_set_header Referrer-Policy no-referrer;
            proxy_buffer_size 32k;
            proxy_buffers 4 64k;
            proxy_busy_buffers_size 64k;
        }
    }
}
