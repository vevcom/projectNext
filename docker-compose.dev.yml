services:
    projectnext:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: dev
        # Published on 80 rather than 3000 because there is no nginx in front of it
        # any more: NEXTAUTH_URL and SERVER_LINK_PREFIX in .env.default point at
        # http://localhost, and /store/ is now served by the app itself
        # (src/app/store/[...path]/route.ts) instead of statically by nginx.
        ports:
            - 80:3000
        volumes:
            - ${PROJECT_ROOT:-.}/src:/usr/src/app/src
            - ${PROJECT_ROOT:-.}/package.json:/usr/src/app/package.json
            - ${PROJECT_ROOT:-.}/package-lock.json:/usr/src/app/package-lock.json
            - ${PROJECT_ROOT:-.}/logs:/usr/src/app/logs
            - devstore:/usr/src/app/store
            - dotnext:/usr/src/app/.next
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        depends_on:
            db:
                condition: service_healthy

    imageworker:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: dev
        command: ["./node_modules/.bin/tsx", "src/lib/images/worker.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        volumes:
            - ${PROJECT_ROOT:-.}/src:/usr/src/app/src
            - ${PROJECT_ROOT:-.}/package.json:/usr/src/app/package.json
            - ${PROJECT_ROOT:-.}/package-lock.json:/usr/src/app/package-lock.json
            - ${PROJECT_ROOT:-.}/logs:/usr/src/app/logs
            - devstore:/usr/src/app/store
        depends_on:
            db:
                condition: service_healthy

    db:
        extends:
            file: docker-compose.base.yml
            service: db
        ports:
            - 5432:5432
        volumes:
            - devdb:/var/lib/postgresql/data

    stripe:
        image: stripe/stripe-cli:v1.37.3
        command: listen --forward-to http://projectnext:3000/api/stripe-events --skip-verify
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET_KEY} 

volumes:
    devdb:
        driver: local
    devstore:
        driver: local
    dotnext:
        driver: local
    dobbelOmegaManifest:
        driver: local
